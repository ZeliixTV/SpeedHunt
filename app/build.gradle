plugins {
    id 'com.android.application'
}

android {
    namespace 'com.speedhunt.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.speedhunt.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('speedhunt.keystore')
            storePassword 'speedhunt'
            keyAlias 'speedhunt'
            keyPassword 'speedhunt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
